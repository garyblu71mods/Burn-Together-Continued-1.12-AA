// BurnTogether Module Configuration
// Adds formation flying capabilities to command modules

// Add BurnTogether to all command pods
@PART[*]:HAS[@MODULE[ModuleCommand]]:FOR[BurnTogether]
{
    MODULE
    {
        name = BurnTogether
    }
}

// Add to probe cores too
@PART[*]:HAS[@MODULE[ModuleCommand],@MODULE[ModuleSAS]]:FOR[BurnTogether]
{
    MODULE
    {
        name = BurnTogether
    }
}
